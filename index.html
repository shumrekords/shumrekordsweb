    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        //  POLL
        const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSclvMWXWY0_tNWfIBND6zfnFmGFjS3LTgYgL4xPStPU3BYzgQ/formResponse';
        const ENTRY_ID = 'entry.1291494100'; // Заменить ентри айди

        function vote(option) {
            if (localStorage.getItem('shum_voted')) {
                showPollMessage('YOUR CHOICE HAS BEEN REKORDED', 'warning');
                return;
            }

            const formData = new FormData();
            formData.append(ENTRY_ID, option);

            fetch(GOOGLE_FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            }).then(() => {
                completeVote(option);
            }).catch(() => {
                completeVote(option);
            });
        }

        function completeVote(option) {
            localStorage.setItem('shum_voted', option);
            document.cookie = "shum_voted=" + option + "; max-age=" + (365*24*60*60) + "; path=/";
            
            disableButtons();
            showPollMessage('YOUR CHOICE HAS BEEN REKORDED (' + option + ')', 'success');
        }

        function disableButtons() {
            document.querySelectorAll('.poll-btn').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
        }

        function showPollMessage(msg, type) {
            const msgEl = document.getElementById('poll-message');
            msgEl.innerText = msg;
            msgEl.className = 'poll-message ' + type;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hasVotedLocal = localStorage.getItem('shum_voted');
            const hasVotedCookie = document.cookie.split('; ').find(row => row.startsWith('shum_voted='));
            
            if (hasVotedLocal || hasVotedCookie) {
                const choice = hasVotedLocal || (hasVotedCookie ? hasVotedCookie.split('=')[1] : '');
                disableButtons();
                showPollMessage('YOUR CHOICE HAS BEEN REKORDED (CHOOSE: ' + choice + ')', 'warning');
            }
        });
    </script>
